<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성전기 전사AI 활용 교육 · 강사 가이드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="login-wrap">
    <p class="kicker">삼성전기 전사AI 활용 교육</p>
    <h1>강사 가이드 로그인</h1>
    <p class="desc">조회용 비밀번호 또는 관리자 비밀번호를 입력해 주세요. 관리자로 로그인하면 내용을 수정할 수 있습니다.</p>
    <form class="login-form" id="loginForm">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p class="login-error" id="errorMsg"></p>
      <button type="submit">입장하기</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/.netlify/functions/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.error || '로그인에 실패했습니다.';
          return;
        }
        if (data.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/view.html';
        }
      } catch (err) {
        errorMsg.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
      }
    });
  </script>
</body>
</html>
