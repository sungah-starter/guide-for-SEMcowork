<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성전기 전사AI 활용 교육 · 강사 가이드 (관리자)</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <span class="title">삼성전기 전사AI 활용 교육 · 강사 가이드</span>
      <span class="badge">관리자</span>
    </div>
    <div class="tabs">
      <button id="tabJugangsa" class="active">주강사용</button>
      <button id="tabBojo">보조강사용</button>
    </div>
    <div class="header-actions">
      <a href="/view.html">조회 화면 보기</a>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </header>
  <p class="status-line" id="statusLine">불러오는 중...</p>

  <div class="admin-grid">
    <div class="edit-toolbar">
      <div class="grp">
        <button id="btnBold" title="굵게 (Ctrl+B)"><b>B</b></button>
        <button id="btnItalic" title="기울임 (Ctrl+I)"><i>I</i></button>
      </div>
      <div class="grp">
        <button id="btnUL" title="글머리 기호 목록">• 목록</button>
        <button id="btnOL" title="번호 매기기 목록">1. 목록</button>
      </div>
      <div class="grp">
        <button id="btnUndo" title="실행 취소 (Ctrl+Z)">↶</button>
        <button id="btnRedo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
      </div>
      <div class="spacer"></div>
      <div class="grp" style="border-right:none;">
        <button id="modeWysiwyg" class="active" title="문서를 보이는 그대로 편집">일반 편집</button>
        <button id="modeCode" title="HTML 원본 코드를 직접 편집(고급)">HTML 코드</button>
      </div>
    </div>

    <p style="font-size:13px;color:#6f6f6f;margin:-4px 0 12px;">
      "일반 편집"에서는 화면에 보이는 문서를 워드/구글독스처럼 그대로 클릭해서 텍스트를 고칠 수 있습니다.
      굵게·목록 등은 위 툴바 버튼이나 Ctrl+B 같은 단축키를 그대로 쓰시면 됩니다. 새 문단/목록 구조를 크게 바꾸고 싶을 때만
      "HTML 코드" 모드를 사용하세요.
    </p>

    <iframe class="editor-frame" id="editorFrame" title="가이드 편집"></iframe>
    <textarea class="editor" id="codeEditor" spellcheck="false" style="display:none;"></textarea>

    <div class="admin-toolbar" style="margin-top:14px;">
      <span class="save-msg" id="saveMsg"></span>
      <button id="saveBtn" style="background:#111;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-family:inherit;cursor:pointer;">저장하기</button>
    </div>
  </div>

  <script>
    let docs = null;          // { jugangsa, bojo, updatedAt, role }
    let current = 'jugangsa'; // which document tab is open
    let mode = 'wysiwyg';     // 'wysiwyg' | 'code'

    const editorFrame = document.getElementById('editorFrame');
    const codeEditor = document.getElementById('codeEditor');
    const statusLine = document.getElementById('statusLine');
    const saveMsg = document.getElementById('saveMsg');
    const tabJugangsa = document.getElementById('tabJugangsa');
    const tabBojo = document.getElementById('tabBojo');
    const modeWysiwyg = document.getElementById('modeWysiwyg');
    const modeCode = document.getElementById('modeCode');

    // ---- rendering helpers ----

    function setFrameContent(html) {
      editorFrame.onload = () => {
        try {
          editorFrame.contentDocument.designMode = 'on';
        } catch (e) {
          console.error('designMode failed', e);
        }
      };
      editorFrame.srcdoc = html;
    }

    function getFrameContent() {
      try {
        return '<!doctype html>\n' + editorFrame.contentDocument.documentElement.outerHTML;
      } catch (e) {
        console.error('reading frame content failed', e);
        return null;
      }
    }

    // read whatever is currently being edited (either mode) into a plain string
    function getCurrentContent() {
      if (mode === 'code') return codeEditor.value;
      const html = getFrameContent();
      return html !== null ? html : (docs ? docs[current] : '');
    }

    // push a content string into whichever mode is currently active
    function setCurrentContent(html) {
      if (mode === 'code') {
        codeEditor.value = html;
      } else {
        setFrameContent(html);
      }
    }

    function setMode(newMode) {
      if (newMode === mode) return;
      const html = getCurrentContent(); // capture before switching editor UI
      mode = newMode;
      modeWysiwyg.classList.toggle('active', mode === 'wysiwyg');
      modeCode.classList.toggle('active', mode === 'code');
      editorFrame.style.display = mode === 'wysiwyg' ? '' : 'none';
      codeEditor.style.display = mode === 'code' ? '' : 'none';
      setCurrentContent(html);
    }

    function switchTab(next) {
      if (next === current) return;
      docs[current] = getCurrentContent(); // keep unsaved edits of the tab we're leaving
      current = next;
      tabJugangsa.classList.toggle('active', current === 'jugangsa');
      tabBojo.classList.toggle('active', current === 'bojo');
      setCurrentContent(docs[current]);
    }

    tabJugangsa.addEventListener('click', () => switchTab('jugangsa'));
    tabBojo.addEventListener('click', () => switchTab('bojo'));
    modeWysiwyg.addEventListener('click', () => setMode('wysiwyg'));
    modeCode.addEventListener('click', () => setMode('code'));

    // ---- formatting toolbar (acts on the iframe's contentEditable document) ----
    function execOnFrame(cmd) {
      if (mode !== 'wysiwyg') return;
      try {
        editorFrame.contentDocument.execCommand(cmd, false, null);
      } catch (e) {
        console.error('execCommand failed', cmd, e);
      }
    }
    [
      ['btnBold', 'bold'],
      ['btnItalic', 'italic'],
      ['btnUL', 'insertUnorderedList'],
      ['btnOL', 'insertOrderedList'],
      ['btnUndo', 'undo'],
      ['btnRedo', 'redo'],
    ].forEach(([id, cmd]) => {
      const btn = document.getElementById(id);
      // prevent the button click from stealing focus/selection out of the iframe
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => execOnFrame(cmd));
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/.netlify/functions/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/index.html';
    });

    // ---- save ----
    document.getElementById('saveBtn').addEventListener('click', async () => {
      saveMsg.textContent = '저장 중...';
      saveMsg.className = 'save-msg';
      docs[current] = getCurrentContent();

      let res;
      try {
        res = await fetch('/.netlify/functions/content', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jugangsa: docs.jugangsa, bojo: docs.bojo }),
        });
      } catch (e) {
        console.error('save fetch failed', e);
        saveMsg.textContent = '서버에 연결할 수 없습니다. (네트워크 오류: ' + e.message + ')';
        saveMsg.className = 'save-msg err';
        return;
      }

      let data, rawText = '';
      try {
        rawText = await res.text();
        data = rawText ? JSON.parse(rawText) : {};
      } catch (e) {
        console.error('save response parse failed', e, rawText);
        saveMsg.textContent = '저장 응답을 해석할 수 없습니다. (HTTP ' + res.status + ')';
        saveMsg.className = 'save-msg err';
        return;
      }

      if (!res.ok) {
        console.error('save failed', res.status, data);
        saveMsg.textContent = (data && data.error) || ('저장에 실패했습니다. (HTTP ' + res.status + ')');
        saveMsg.className = 'save-msg err';
        return;
      }

      // Verify persistence with a fresh read-back rather than trusting the echoed response alone.
      try {
        const verifyRes = await fetch('/.netlify/functions/content', { credentials: 'include', cache: 'no-store' });
        const verifyData = await verifyRes.json();
        if (verifyRes.ok && verifyData.updatedAt === data.updatedAt) {
          docs = verifyData;
          saveMsg.textContent = '저장 및 반영 확인 완료. (' + new Date(verifyData.updatedAt).toLocaleString('ko-KR') + ')';
          saveMsg.className = 'save-msg ok';
        } else {
          docs = data;
          saveMsg.textContent = '저장은 됐지만 반영 확인에 실패했습니다. 새로고침 후 다시 확인해 주세요.';
          saveMsg.className = 'save-msg err';
        }
      } catch (e) {
        docs = data;
        saveMsg.textContent = '저장되었습니다 (반영 확인은 실패). (' + new Date(data.updatedAt).toLocaleString('ko-KR') + ')';
        saveMsg.className = 'save-msg ok';
      }
    });

    // ---- initial load ----
    (async function load() {
      let res;
      try {
        res = await fetch('/.netlify/functions/content', { credentials: 'include', cache: 'no-store' });
      } catch (e) {
        console.error('load fetch failed', e);
        statusLine.textContent = '서버에 연결할 수 없습니다. (네트워크 오류: ' + e.message + ')';
        return;
      }
      if (res.status === 401) {
        window.location.href = '/index.html';
        return;
      }
      let data, rawText = '';
      try {
        rawText = await res.text();
        data = rawText ? JSON.parse(rawText) : {};
      } catch (e) {
        console.error('load response parse failed', e, rawText);
        statusLine.textContent = '응답을 해석할 수 없습니다. (HTTP ' + res.status + ')';
        return;
      }
      if (!res.ok) {
        statusLine.textContent = data.error || ('내용을 불러오지 못했습니다. (HTTP ' + res.status + ')');
        return;
      }
      if (data.role !== 'admin') {
        statusLine.textContent = '관리자 권한이 없습니다. 조회 화면으로 이동합니다.';
        setTimeout(() => { window.location.href = '/view.html'; }, 1200);
        return;
      }
      docs = data;
      statusLine.textContent = data.updatedAt
        ? ('마지막 수정: ' + new Date(data.updatedAt).toLocaleString('ko-KR'))
        : '아직 수정된 이력이 없습니다 (초기 초안 표시 중).';
      setCurrentContent(docs[current]);
    })();
  </script>
</body>
</html>
