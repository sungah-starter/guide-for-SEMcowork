<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성전기 전사AI 활용 교육 · 강사 가이드 (조회)</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <span class="title">삼성전기 전사AI 활용 교육 · 강사 가이드</span>
      <span class="badge" id="roleBadge">조회</span>
    </div>
    <div class="tabs">
      <button id="tabJugangsa" class="active">주강사용</button>
      <button id="tabBojo">보조강사용</button>
    </div>
    <div class="header-actions">
      <button id="logoutBtn">로그아웃</button>
    </div>
  </header>
  <p class="status-line" id="statusLine">불러오는 중...</p>
  <div class="viewer-frame-wrap">
    <iframe class="doc-frame" id="docFrame" title="가이드 내용"></iframe>
  </div>

  <script>
    let docs = null;
    let current = 'jugangsa';

    const frame = document.getElementById('docFrame');
    const statusLine = document.getElementById('statusLine');
    const roleBadge = document.getElementById('roleBadge');
    const tabJugangsa = document.getElementById('tabJugangsa');
    const tabBojo = document.getElementById('tabBojo');

    function render() {
      if (!docs) return;
      frame.srcdoc = current === 'jugangsa' ? docs.jugangsa : docs.bojo;
      tabJugangsa.classList.toggle('active', current === 'jugangsa');
      tabBojo.classList.toggle('active', current === 'bojo');
    }

    tabJugangsa.addEventListener('click', () => { current = 'jugangsa'; render(); });
    tabBojo.addEventListener('click', () => { current = 'bojo'; render(); });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/.netlify/functions/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/index.html';
    });

    (async function load() {
      try {
        const res = await fetch('/.netlify/functions/content', { credentials: 'include', cache: 'no-store' });
        if (res.status === 401) {
          window.location.href = '/index.html';
          return;
        }
        const data = await res.json();
        if (!res.ok) {
          statusLine.textContent = data.error || '내용을 불러오지 못했습니다.';
          return;
        }
        docs = data;
        roleBadge.textContent = data.role === 'admin' ? '관리자' : '조회';
        statusLine.textContent = data.updatedAt
          ? ('마지막 수정: ' + new Date(data.updatedAt).toLocaleString('ko-KR'))
          : '아직 수정된 이력이 없습니다 (초기 초안 표시 중).';
        render();
      } catch (e) {
        statusLine.textContent = '서버에 연결할 수 없습니다.';
      }
    })();
  </script>
</body>
</html>
